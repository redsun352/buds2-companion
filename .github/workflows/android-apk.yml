name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Expo config
        run: npx expo config --type public > /tmp/expo-config.json

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --no-install

      - name: Restore Gradle wrapper executable bit
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Buds2-Companion-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
